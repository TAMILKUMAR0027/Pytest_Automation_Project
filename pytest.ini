[pytest]
# ── Test discovery ────────────────────────────────────────────
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    smoke: Quick sanity checks - run on every commit
    regression: Full regression suite
    sanity: Sanity / build-verification tests
    e2e: End-to-end flow tests
    negative: Negative / invalid-input scenarios
    slow: Tests that take longer than usual
    Tamil: Tamil-specific test cases
    Jothika:Jothika-testcases